name: "HVTrust Gate"
description: "Trust grades for the AI agents and MCP servers your repo uses. Zero config, PR comments, optional CI gate by grade."
author: "HVTracker"
branding:
  icon: shield
  color: green

inputs:
  targets:
    description: >-
      Dependencies to check, comma- or newline-separated. Each entry may be a
      GitHub owner/repo, repo URL, npm or PyPI package name, HVTracker slug,
      or display name (same resolution as hvtracker.net/verify). Leave empty
      to scan the repository's dependency files instead.
    required: false
    default: ""
  scan:
    description: >-
      When no targets are given: "auto" (default) finds requirements*.txt,
      pyproject.toml, package.json and MCP client configs (.mcp.json,
      .vscode/mcp.json, .cursor/mcp.json); or list specific files; "false"
      disables scanning.
    required: false
    default: "auto"
  comment:
    description: >-
      Pull-request comment with the results: "auto" (default) posts or updates
      one comment when the PR changes a scanned dependency file; "always" on
      every PR run; "false" never. Needs `pull-requests: write`.
    required: false
    default: "auto"
  github-token:
    description: "Token used to comment on pull requests."
    required: false
    default: ${{ github.token }}
  min-grade:
    description: "Minimum acceptable trust grade: A, B, C, or D (default C)."
    required: false
    default: "C"
  fail-on-untracked:
    description: >-
      Treat targets that are not in the HVTracker registry as failures
      (default false: untracked targets only warn).
    required: false
    default: "false"
  warn-only:
    description: "Never fail the job; report findings only (default false)."
    required: false
    default: "false"

outputs:
  failures:
    description: "Number of targets below the threshold (or untracked when fail-on-untracked)."
    value: ${{ steps.gate.outputs.failures }}
  report:
    description: "One-line-per-target result summary."
    value: ${{ steps.gate.outputs.report }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        HVT_TARGETS: ${{ inputs.targets }}
        HVT_MIN_GRADE: ${{ inputs['min-grade'] }}
        HVT_FAIL_ON_UNTRACKED: ${{ inputs['fail-on-untracked'] }}
        HVT_WARN_ONLY: ${{ inputs['warn-only'] }}
        HVT_SCAN: ${{ inputs.scan }}
        HVT_COMMENT: ${{ inputs.comment }}
        HVT_TOKEN: ${{ inputs['github-token'] }}
      run: python3 "${{ github.action_path }}/gate.py"
